name: AuditSphere Development CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ dev, develop ]

concurrency:
  group: auditsphere-development
  cancel-in-progress: false

jobs:
  deploy-dev-vps:
    name: Deploy Dev to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Execute SSH Dev Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD || secrets.SERVER_PASSWORD }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60m
          command_timeout: 60m
          script_stop: true
          script: |
            set -Eeuo pipefail
            export LOCK_FILE="/tmp/auditsphere_deploy_dev.lock"

            wait_for_container_health() {
              local container_name="$1"
              local service_name="$2"
              local max_attempts="${3:-20}"

              if [ -z "$container_name" ]; then
                echo "❌ $service_name container ID/name is empty."
                return 1
              fi

              for i in $(seq 1 "$max_attempts"); do
                local status
                status=$(docker inspect --format='{{.State.Health.Status}}' "$container_name" 2>/dev/null || echo "not_found")
                if [ "$status" = "healthy" ]; then
                  echo "✅ $service_name is healthy."
                  return 0
                fi
                echo "⏳ $service_name status: $status — waiting... attempt $i/$max_attempts"
                sleep 5
              done
              return 1
            }

            main() {
              # ================================================================
              # Configuration
              # ================================================================
              REPO_URL="https://github.com/RauMomo/risk-based-audit.git"
              REPO_DIR="/app/rbia-repo-dev"
              FRONTEND_DIR="$REPO_DIR/frontend"
              FRONTEND_COMPOSE="docker-compose.dev.yml"
              FRONTEND_CONTAINER_FILTER="rbia-frontend-dev"
              TARGET_BRANCH="${GITHUB_REF_NAME:-dev}"

              echo ""
              echo "============================================================"
              echo "🚀 AuditSphere Development Deployment (dev.auditsphere.app)"
              echo "============================================================"
              echo "Started at: $(date)"

              exec 200>"$LOCK_FILE"
              if ! flock -n 200; then
                echo "❌ Another AuditSphere Dev deployment is currently running on VPS."
                exit 1
              fi
              echo "🔒 Deployment lock acquired."

              # ================================================================
              # Error Handler & Diagnostics
              # ================================================================
              cleanup_on_failure() {
                echo ""
                echo "============================================================"
                echo "❌ DEV DEPLOYMENT FAILED - INITIATING DIAGNOSTICS"
                echo "============================================================"

                echo "📦 Dev Frontend status & logs:"
                cd "$FRONTEND_DIR" || true
                docker compose -f "$FRONTEND_COMPOSE" ps || true
                docker compose -f "$FRONTEND_COMPOSE" logs --tail=50 || true

                echo "⚠️ Dev Deployment aborted due to errors. Check logs above."
              }

              trap cleanup_on_failure ERR

              export GIT_TERMINAL_PROMPT=0

              # ================================================================
              # Resource & Disk Checks
              # ================================================================
              echo ""
              echo "🔍 Checking VPS system resources..."
              DISK_USAGE=$(df --output=pcent / | tail -1 | tr -dc '0-9')
              if [ "$DISK_USAGE" -ge 90 ]; then
                echo "❌ Disk usage is ${DISK_USAGE}%. Aborting deployment to prevent failure."
                exit 1
              fi
              echo "✅ Disk usage: ${DISK_USAGE}%"

              # ================================================================
              # Update Repository Code (Dev Branch)
              # ================================================================
              echo ""
              echo "📦 Syncing dev repository (fresh clone)..."
              echo "🗑️ Removing stale dev repo dir: $REPO_DIR"
              rm -rf "$REPO_DIR"

              echo "📥 Cloning branch '$TARGET_BRANCH' from $REPO_URL..."
              if ! git clone --depth 1 --branch "$TARGET_BRANCH" "$REPO_URL" "$REPO_DIR" 2>&1; then
                echo "⚠️ Branch '$TARGET_BRANCH' not found. Falling back to 'main'..."
                git clone --depth 1 --branch main "$REPO_URL" "$REPO_DIR" 2>&1
              fi
              echo "   ✓ clone OK"

              cd "$REPO_DIR"
              CURRENT_COMMIT=$(git rev-parse HEAD 2>&1) || { echo "❌ git rev-parse failed"; exit 1; }
              echo "📌 Commit: $CURRENT_COMMIT ($(git log -1 --pretty=format:'%s' 2>&1))"

              export DOCKER_BUILDKIT=1
              export COMPOSE_DOCKER_CLI_BUILD=1

              # ================================================================
              # Deploy Dev Frontend Service (Port 3001)
              # ================================================================
              echo ""
              echo "============================================================"
              echo "🚀 Deploying Dev Frontend Service (Port 3001 -> dev.auditsphere.app)"
              echo "============================================================"
              cd "$FRONTEND_DIR"

              # If docker-compose.dev.yml doesn't exist on server yet, copy or create fallback
              if [ ! -f "$FRONTEND_COMPOSE" ]; then
                echo "⚠️ $FRONTEND_COMPOSE not found, using docker-compose.prod.yml with port 3001 override..."
                cp docker-compose.prod.yml "$FRONTEND_COMPOSE"
                sed -i 's/"3000:3000"/"3001:3000"/g' "$FRONTEND_COMPOSE"
                sed -i 's/container_name: rbia-frontend-prod/container_name: rbia-frontend-dev/g' "$FRONTEND_COMPOSE"
              fi

              echo "🔨 Building frontend dev image..."
              docker compose -f "$FRONTEND_COMPOSE" build

              echo "🧹 Removing old dev frontend container..."
              docker rm -f rbia-frontend-dev 2>/dev/null || true

              echo "🚀 Starting dev frontend container..."
              docker compose -f "$FRONTEND_COMPOSE" up -d --force-recreate --remove-orphans

              echo "🏥 Waiting for dev frontend health..."
              FRONTEND_READY=0

              for i in {1..30}; do
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 5 "http://127.0.0.1:3001" 2>/dev/null || echo "000")
                if [ "$HTTP_CODE" -eq "000" ]; then
                  HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 5 "http://localhost:3001" 2>/dev/null || echo "000")
                fi

                CONTAINER_OK=0
                if docker exec rbia-frontend-dev wget --spider -q http://localhost:3000 2>/dev/null || \
                   docker exec rbia-frontend-dev node -e "require('http').get('http://localhost:3000', res => process.exit(res.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))" 2>/dev/null; then
                  CONTAINER_OK=1
                fi

                if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 302 ] || [ "$HTTP_CODE" -eq 301 ] || [ "$CONTAINER_OK" -eq 1 ]; then
                  echo "✅ Dev Frontend is healthy (Host Port 3001 HTTP $HTTP_CODE / Container OK)."
                  FRONTEND_READY=1
                  break
                fi
                echo "⏳ Waiting for dev frontend application (host status: $HTTP_CODE)... attempt $i/30"
                sleep 5
              done

              if [ "$FRONTEND_READY" -ne 1 ]; then
                echo "❌ Dev Frontend health check failed."
                exit 1
              fi

              # ================================================================
              # Cleanup & Finish
              # ================================================================
              echo ""
              echo "🧹 Pruning unused Docker images..."
              docker image prune -f

              echo ""
              echo "============================================================"
              echo "✅ AUDITSPHERE DEV DEPLOYMENT SUCCESSFUL"
              echo "============================================================"
              echo "🌐 URL: https://dev.auditsphere.app"
              echo "Finished at: $(date)"
            }

            main "$@"
