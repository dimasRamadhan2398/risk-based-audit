name: AuditSphere Development CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - develop

concurrency:
  group: auditsphere-development
  cancel-in-progress: false

jobs:
  deploy-dev-vps:
    name: Deploy Dev to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Dev to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}

          timeout: 60m
          command_timeout: 60m
          script_stop: true

          script: |
            echo "============================================================"
            echo "🚀 AuditSphere DEV SSH TEST"
            echo "============================================================"

            echo "✅ SSH connection successful"

            echo "👤 User:"
            whoami

            echo "🖥️ Host:"
            hostname

            echo "📅 Date:"
            date

            echo "🐳 Docker:"
            docker --version

            echo "🐙 Docker Compose:"
            docker compose version

            echo "📁 Current directory:"
            pwd

            echo "💾 Disk:"
            df -h /

            echo "============================================================"
            echo "✅ SSH TEST COMPLETED"
            echo "============================================================"