name: AuditSphere Production Backend Deploy

# Manual only. Runs backend/deploy-prod.sh, which:
#   * builds from `git archive <ref>`, never from the runner's working tree
#   * backs up every database (pg_dumpall) before any change
#   * starts containers with migrate-only commands (no seeders)
#   * keeps audit uploads, checks row counts, and rolls back a failing service
#   * deploys one service at a time with --no-deps
# It never touches postgres, redis, kafka, kong, the frontend, or tenant stacks.
# Frontend and Kong config are NOT deployed by this workflow (frontend: manual;
# Kong: scripts/sync-kong.sh on the VPS).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy, e.g. origin/staging or a commit SHA'
        required: true
        default: 'origin/staging'
        type: string
      services:
        description: 'Services: all, or a space-separated subset of auth audit master risk analytics'
        required: true
        default: 'all'
        type: string

concurrency:
  group: auditsphere-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-prod-backend:
    name: Deploy backend to production VPS
    runs-on: ubuntu-latest
    # Configure this environment in GitHub with required reviewers before first use.
    environment: production
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Resolve deploy ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          git fetch --prune origin
          git rev-parse --verify --quiet "$REF^{commit}" >/dev/null \
            || { echo "::error::ref '$REF' does not resolve to a commit"; exit 1; }
          echo "Deploying $(git rev-parse --short "$REF^{commit}") from $REF"

      - name: Install SSH key and pinned host key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$VPS_SSH_KEY" ] || { echo "::error::VPS_SSH_KEY secret is empty"; exit 1; }
          [ -n "$VPS_KNOWN_HOSTS" ] || { echo "::error::VPS_KNOWN_HOSTS secret is empty (pin the VPS host key; do not use ssh-keyscan)"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null || { echo "::error::VPS_SSH_KEY is not a usable private key (passphrase-protected keys are not supported here)"; exit 1; }

      - name: Deploy backend services
        env:
          REF: ${{ inputs.ref }}
          SERVICES: ${{ inputs.services }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          backend/deploy-prod.sh --yes --ref "$REF" $SERVICES

      - name: Summary
        if: always()
        run: |
          echo "Deploy ref: ${{ inputs.ref }}"
          echo "Services:   ${{ inputs.services }}"
          echo "Status:     ${{ job.status }}"
          echo "Server logs: /root/auditsphere-deploy/<timestamp>/deploy.log on the VPS"
