name: AuditSphere CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: auditsphere-production
  cancel-in-progress: false

jobs:
  deploy-vps:
    name: Deploy AuditSphere to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_REF: ${{ github.ref_name }}
          DEPLOY_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}

          timeout: 60m
          command_timeout: 60m
          script_stop: true

          envs: DEPLOY_SHA,DEPLOY_REF,DEPLOY_ACTOR

          script: |
            set -Eeuo pipefail

            # ================================================================
            # Configuration
            # ================================================================

            APP_NAME="auditsphere"

            REPO_URL="https://github.com/RauMomo/risk-based-audit.git"
            REPO_DIR="/app/rbia-repo"

            BACKEND_DIR="$REPO_DIR/backend"
            FRONTEND_DIR="$REPO_DIR/frontend"

            BACKEND_COMPOSE="docker-compose.prod.yml"
            FRONTEND_COMPOSE="docker-compose.prod.yml"

            BACKEND_CONTAINER_FILTER="rb_audit"
            FRONTEND_CONTAINER_FILTER="rbia-frontend"

            LOCK_FILE="/tmp/auditsphere_deploy.lock"

            BACKEND_HEALTH_URL="http://localhost:8080/api/v1/auth/health"
            AUTH_HEALTH_URL="http://localhost:8001/health"

            FRONTEND_HEALTH_URL="http://127.0.0.1:3000"

            MAX_BACKEND_ATTEMPTS=30
            MAX_FRONTEND_ATTEMPTS=30

            DEPLOY_STARTED_AT="$(date '+%Y-%m-%d %H:%M:%S')"

            # ================================================================
            # Utility Functions
            # ================================================================

            log() {
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] $*"
            }

            fail() {
              echo ""
              echo "❌ $*"
              exit 1
            }

            wait_for_container_health() {
              local container_name="$1"
              local service_name="$2"
              local max_attempts="${3:-30}"

              if [ -z "$container_name" ]; then
                log "❌ $service_name container ID is empty."
                return 1
              fi

              for i in $(seq 1 "$max_attempts"); do

                local status

                status="$(
                  docker inspect \
                    --format='{{.State.Health.Status}}' \
                    "$container_name" \
                    2>/dev/null || echo "not_found"
                )"

                if [ "$status" = "healthy" ]; then
                  log "✅ $service_name is healthy."
                  return 0
                fi

                log "⏳ $service_name status: $status — attempt $i/$max_attempts"

                sleep 5
              done

              return 1
            }

            wait_for_http() {
              local url="$1"
              local service_name="$2"
              local max_attempts="${3:-30}"

              for i in $(seq 1 "$max_attempts"); do

                local http_code

                http_code="$(
                  curl \
                    -s \
                    -o /dev/null \
                    -w "%{http_code}" \
                    -L \
                    --max-time 5 \
                    "$url" \
                    2>/dev/null || echo "000"
                )"

                if [ "$http_code" = "200" ] ||
                   [ "$http_code" = "301" ] ||
                   [ "$http_code" = "302" ]; then

                  log "✅ $service_name is responding with HTTP $http_code."
                  return 0
                fi

                log "⏳ $service_name HTTP status: $http_code — attempt $i/$max_attempts"

                sleep 5
              done

              return 1
            }

            # ================================================================
            # Previous Container/Image State
            # ================================================================

            PREVIOUS_BACKEND_IMAGE_ID=""
            PREVIOUS_BACKEND_IMAGE_TAG=""

            PREVIOUS_FRONTEND_IMAGE_ID=""
            PREVIOUS_FRONTEND_IMAGE_TAG=""

            capture_previous_state() {

              log "📸 Capturing current production image state..."

              local backend_container_id
              local frontend_container_id

              backend_container_id="$(
                docker ps \
                  --filter "name=${BACKEND_CONTAINER_FILTER}" \
                  -q \
                  | head -1 || true
              )"

              if [ -n "$backend_container_id" ]; then

                PREVIOUS_BACKEND_IMAGE_ID="$(
                  docker inspect \
                    "$backend_container_id" \
                    --format '{{.Image}}' \
                    2>/dev/null || true
                )"

                PREVIOUS_BACKEND_IMAGE_TAG="$(
                  docker inspect \
                    "$backend_container_id" \
                    --format '{{.Config.Image}}' \
                    2>/dev/null || true
                )"

              fi

              frontend_container_id="$(
                docker ps \
                  --filter "name=${FRONTEND_CONTAINER_FILTER}" \
                  -q \
                  | head -1 || true
              )"

              if [ -n "$frontend_container_id" ]; then

                PREVIOUS_FRONTEND_IMAGE_ID="$(
                  docker inspect \
                    "$frontend_container_id" \
                    --format '{{.Image}}' \
                    2>/dev/null || true
                )"

                PREVIOUS_FRONTEND_IMAGE_TAG="$(
                  docker inspect \
                    "$frontend_container_id" \
                    --format '{{.Config.Image}}' \
                    2>/dev/null || true
                )"

              fi

              log "Previous backend image:"
              log "  ID  : ${PREVIOUS_BACKEND_IMAGE_ID:-none}"
              log "  Tag : ${PREVIOUS_BACKEND_IMAGE_TAG:-none}"

              log "Previous frontend image:"
              log "  ID  : ${PREVIOUS_FRONTEND_IMAGE_ID:-none}"
              log "  Tag : ${PREVIOUS_FRONTEND_IMAGE_TAG:-none}"
            }

            # ================================================================
            # Diagnostics
            # ================================================================

            diagnostics() {

              log "============================================================"
              log "🔎 DEPLOYMENT DIAGNOSTICS"
              log "============================================================"

              log "Docker containers:"
              docker ps -a \
                --format "table {{.Names}}\t{{.Status}}\t{{.Image}}" \
                || true

              log ""
              log "Backend compose status:"

              if [ -d "$BACKEND_DIR" ]; then
                cd "$BACKEND_DIR" || true

                docker compose \
                  -f "$BACKEND_COMPOSE" \
                  ps \
                  || true

                log ""
                log "Backend logs:"
                docker compose \
                  -f "$BACKEND_COMPOSE" \
                  logs \
                  --tail=100 \
                  || true
              fi

              log ""
              log "Frontend compose status:"

              if [ -d "$FRONTEND_DIR" ]; then
                cd "$FRONTEND_DIR" || true

                docker compose \
                  -f "$FRONTEND_COMPOSE" \
                  ps \
                  || true

                log ""
                log "Frontend logs:"
                docker compose \
                  -f "$FRONTEND_COMPOSE" \
                  logs \
                  --tail=100 \
                  || true
              fi

              log ""
              log "Disk usage:"
              df -h || true
            }

            # ================================================================
            # Rollback
            # ================================================================

            rollback() {

              log ""
              log "============================================================"
              log "🔄 STARTING ROLLBACK"
              log "============================================================"

              local rollback_failed=0

              # ------------------------------------------------------------
              # Backend rollback
              # ------------------------------------------------------------

              if [ -n "$PREVIOUS_BACKEND_IMAGE_ID" ] &&
                 [ -n "$PREVIOUS_BACKEND_IMAGE_TAG" ]; then

                log "🔄 Rolling back backend..."

                if docker image inspect "$PREVIOUS_BACKEND_IMAGE_ID" >/dev/null 2>&1; then

                  docker tag \
                    "$PREVIOUS_BACKEND_IMAGE_ID" \
                    "$PREVIOUS_BACKEND_IMAGE_TAG" \
                    || rollback_failed=1

                  cd "$BACKEND_DIR" || rollback_failed=1

                  docker compose \
                    -f "$BACKEND_COMPOSE" \
                    up -d \
                    --no-build \
                    || rollback_failed=1

                else

                  log "⚠️ Previous backend image no longer exists."

                fi

              else

                log "⚠️ No previous backend image available."

              fi

              # ------------------------------------------------------------
              # Frontend rollback
              # ------------------------------------------------------------

              if [ -n "$PREVIOUS_FRONTEND_IMAGE_ID" ] &&
                 [ -n "$PREVIOUS_FRONTEND_IMAGE_TAG" ]; then

                log "🔄 Rolling back frontend..."

                if docker image inspect "$PREVIOUS_FRONTEND_IMAGE_ID" >/dev/null 2>&1; then

                  docker tag \
                    "$PREVIOUS_FRONTEND_IMAGE_ID" \
                    "$PREVIOUS_FRONTEND_IMAGE_TAG" \
                    || rollback_failed=1

                  cd "$FRONTEND_DIR" || rollback_failed=1

                  docker compose \
                    -f "$FRONTEND_COMPOSE" \
                    up -d \
                    --no-build \
                    || rollback_failed=1

                else

                  log "⚠️ Previous frontend image no longer exists."

                fi

              else

                log "⚠️ No previous frontend image available."

              fi

              if [ "$rollback_failed" -eq 0 ]; then
                log "✅ Rollback commands completed."
              else
                log "❌ Rollback encountered errors."
              fi

              return "$rollback_failed"
            }

            # ================================================================
            # Deployment Failure Handler
            # ================================================================

            cleanup_on_failure() {

              log ""
              log "============================================================"
              log "❌ AUDITSPHERE DEPLOYMENT FAILED"
              log "============================================================"

              diagnostics

              rollback || true

              log ""
              log "============================================================"
              log "❌ DEPLOYMENT ABORTED"
              log "============================================================"

              exit 1
            }

            # ================================================================
            # Main Deployment
            # ================================================================

            main() {

              trap cleanup_on_failure ERR

              log ""
              log "============================================================"
              log "🚀 AuditSphere Production Deployment"
              log "============================================================"

              log "Application : $APP_NAME"
              log "Commit SHA  : $DEPLOY_SHA"
              log "Branch      : $DEPLOY_REF"
              log "Actor       : $DEPLOY_ACTOR"
              log "Started     : $DEPLOY_STARTED_AT"

              # ==============================================================
              # Deployment Lock
              # ==============================================================

              exec 200>"$LOCK_FILE"

              if ! flock -n 200; then
                fail "Another AuditSphere deployment is currently running."
              fi

              log "🔒 Deployment lock acquired."

              # ==============================================================
              # System Check
              # ==============================================================

              log ""
              log "🔍 Checking VPS resources..."

              DISK_USAGE="$(
                df \
                  --output=pcent \
                  / \
                  | tail -1 \
                  | tr -dc '0-9'
              )"

              log "Disk usage: ${DISK_USAGE}%"

              if [ "$DISK_USAGE" -ge 90 ]; then
                fail "Disk usage is ${DISK_USAGE}%. Deployment aborted."
              fi

              MEMORY_AVAILABLE="$(
                free -m \
                  | awk '/^Mem:/ {print $7}'
              )"

              log "Available memory: ${MEMORY_AVAILABLE} MB"

              # ==============================================================
              # Capture Current Production State
              # ==============================================================

              capture_previous_state

              # ==============================================================
              # Repository
              # ==============================================================

              log ""
              log "============================================================"
              log "📦 Preparing source code"
              log "============================================================"

              export GIT_TERMINAL_PROMPT=0

              if [ -d "$REPO_DIR/.git" ]; then

                log "Repository already exists."

                cd "$REPO_DIR"

                git fetch \
                  --depth 1 \
                  origin \
                  "$DEPLOY_SHA"

                git reset \
                  --hard \
                  "$DEPLOY_SHA"

                git clean \
                  -fd

              else

                log "Repository does not exist. Performing initial clone."

                rm -rf "$REPO_DIR"

                git clone \
                  --depth 1 \
                  "$REPO_URL" \
                  "$REPO_DIR"

                cd "$REPO_DIR"

                git fetch \
                  --depth 1 \
                  origin \
                  "$DEPLOY_SHA"

                git checkout \
                  "$DEPLOY_SHA"

              fi

              CURRENT_COMMIT="$(git rev-parse HEAD)"

              if [ "$CURRENT_COMMIT" != "$DEPLOY_SHA" ]; then
                fail "Checked out commit $CURRENT_COMMIT but expected $DEPLOY_SHA"
              fi

              log "✅ Exact commit verified:"
              log "$CURRENT_COMMIT"

              log "Commit message:"
              git log -1 --pretty=format:'%s%n'

              # ==============================================================
              # Docker Configuration
              # ==============================================================

              export DOCKER_BUILDKIT=1
              export COMPOSE_DOCKER_CLI_BUILD=1

              # ==============================================================
              # Backend Deployment
              # ==============================================================

              log ""
              log "============================================================"
              log "🚀 Deploying Backend"
              log "============================================================"

              cd "$BACKEND_DIR"

              log "🔨 Building backend images..."

              docker compose \
                -f "$BACKEND_COMPOSE" \
                build \
                --parallel

              log "🚀 Starting backend services..."

              docker compose \
                -f "$BACKEND_COMPOSE" \
                up -d \
                --force-recreate \
                --remove-orphans

              # ==============================================================
              # Kafka / Zookeeper
              #
              # Do NOT rebuild these on every deployment.
              # Docker Compose will keep existing containers when
              # configuration/image has not changed.
              # ==============================================================

              log ""
              log "🔎 Checking Zookeeper..."

              ZK_CONTAINER_ID="$(
                docker compose \
                  -f "$BACKEND_COMPOSE" \
                  ps -q zookeeper \
                  | head -1 || true
              )"

              if [ -n "$ZK_CONTAINER_ID" ]; then

                if docker inspect \
                  --format='{{.State.Health.Status}}' \
                  "$ZK_CONTAINER_ID" \
                  2>/dev/null \
                  | grep -q "healthy"; then

                  log "✅ Zookeeper already healthy."

                else

                  log "⏳ Waiting for Zookeeper..."

                  wait_for_container_health \
                    "$ZK_CONTAINER_ID" \
                    "Zookeeper" \
                    48 \
                    || fail "Zookeeper failed health check."

                fi

              else

                log "⚠️ Zookeeper container not found."

              fi

              log ""
              log "🔎 Checking Kafka..."

              KAFKA_CONTAINER_ID="$(
                docker compose \
                  -f "$BACKEND_COMPOSE" \
                  ps -q kafka \
                  | head -1 || true
              )"

              if [ -n "$KAFKA_CONTAINER_ID" ]; then

                wait_for_container_health \
                  "$KAFKA_CONTAINER_ID" \
                  "Kafka" \
                  72 \
                  || fail "Kafka failed health check."

              else

                log "⚠️ Kafka container not found."

              fi

              # ==============================================================
              # Backend Health
              # ==============================================================

              log ""
              log "🏥 Checking backend API..."

              BACKEND_READY=0

              for i in $(seq 1 "$MAX_BACKEND_ATTEMPTS"); do

                GATEWAY_STATUS="$(
                  curl \
                    -s \
                    -o /dev/null \
                    -w "%{http_code}" \
                    -L \
                    --max-time 5 \
                    "$BACKEND_HEALTH_URL" \
                    2>/dev/null || echo "000"
                )"

                AUTH_STATUS="$(
                  curl \
                    -s \
                    -o /dev/null \
                    -w "%{http_code}" \
                    -L \
                    --max-time 5 \
                    "$AUTH_HEALTH_URL" \
                    2>/dev/null || echo "000"
                )"

                log "Backend: gateway=$GATEWAY_STATUS auth=$AUTH_STATUS attempt=$i/$MAX_BACKEND_ATTEMPTS"

                if [ "$GATEWAY_STATUS" = "200" ] ||
                   [ "$AUTH_STATUS" = "200" ]; then

                  BACKEND_READY=1
                  break

                fi

                sleep 5

              done

              if [ "$BACKEND_READY" -ne 1 ]; then
                fail "Backend health check failed."
              fi

              log "✅ Backend is healthy."

              # ==============================================================
              # Frontend Environment
              # ==============================================================

              log ""
              log "============================================================"
              log "🚀 Deploying Frontend"
              log "============================================================"

              cd "$FRONTEND_DIR"

              log "📝 Creating production environment..."

              {
                echo "API_BASE_URL=https://api.auditsphere.app/api/v1"
                echo "ANALYTICS_API_BASE_URL=https://api.auditsphere.app/api/analytics"
                echo "NUXT_PUBLIC_AUTH_SERVICE_BASE_URL=https://api.auditsphere.app/api/v1"
                echo "NUXT_PUBLIC_AUDIT_SERVICE_BASE_URL=https://api.auditsphere.app/api/v1"
                echo "NUXT_PUBLIC_RISK_SERVICE_BASE_URL=https://api.auditsphere.app/api/v1"
                echo "NUXT_PUBLIC_MASTER_SERVICE_BASE_URL=https://api.auditsphere.app/api/v1"
              } > .env

              # ==============================================================
              # Frontend Build
              # ==============================================================

              log "🔨 Building frontend image..."

              docker compose \
                -f "$FRONTEND_COMPOSE" \
                build

              log "🚀 Starting frontend..."

              docker compose \
                -f "$FRONTEND_COMPOSE" \
                up -d \
                --force-recreate \
                --remove-orphans

              # ==============================================================
              # Frontend Health
              # ==============================================================

              log ""
              log "🏥 Checking frontend..."

              FRONTEND_READY=0

              for i in $(seq 1 "$MAX_FRONTEND_ATTEMPTS"); do

                HTTP_CODE="$(
                  curl \
                    -s \
                    -o /dev/null \
                    -w "%{http_code}" \
                    -L \
                    --max-time 5 \
                    "$FRONTEND_HEALTH_URL" \
                    2>/dev/null || echo "000"
                )"

                log "Frontend HTTP status: $HTTP_CODE — attempt $i/$MAX_FRONTEND_ATTEMPTS"

                if [ "$HTTP_CODE" = "200" ] ||
                   [ "$HTTP_CODE" = "301" ] ||
                   [ "$HTTP_CODE" = "302" ]; then

                  FRONTEND_READY=1
                  break

                fi

                sleep 5

              done

              if [ "$FRONTEND_READY" -ne 1 ]; then
                fail "Frontend health check failed."
              fi

              log "✅ Frontend is healthy."

              # ==============================================================
              # Post Deployment Smoke Test
              # ==============================================================

              log ""
              log "============================================================"
              log "🧪 Running post-deployment smoke tests"
              log "============================================================"

              log "Testing backend gateway..."

              curl \
                -fsS \
                --max-time 10 \
                "$BACKEND_HEALTH_URL" \
                >/dev/null

              log "✅ Backend smoke test passed."

              log "Testing frontend..."

              curl \
                -fsS \
                --max-time 10 \
                "$FRONTEND_HEALTH_URL" \
                >/dev/null

              log "✅ Frontend smoke test passed."

              # ==============================================================
              # Deployment Metadata
              # ==============================================================

              log ""
              log "📌 Deployment information:"

              log "Commit SHA : $DEPLOY_SHA"
              log "Branch     : $DEPLOY_REF"
              log "Actor      : $DEPLOY_ACTOR"

              echo "$DEPLOY_SHA" > /tmp/auditsphere_current_commit

              # ==============================================================
              # Docker Cleanup
              # ==============================================================

              log ""
              log "🧹 Cleaning unused Docker resources..."

              docker image prune -f

              # ==============================================================
              # Final Verification
              # ==============================================================

              log ""
              log "============================================================"
              log "🔎 Final container state"
              log "============================================================"

              docker ps \
                --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

              # ==============================================================
              # Success
              # ==============================================================

              log ""
              log "============================================================"
              log "✅ AUDITSPHERE DEPLOYMENT SUCCESSFUL"
              log "============================================================"

              log "Commit     : $DEPLOY_SHA"
              log "Finished   : $(date '+%Y-%m-%d %H:%M:%S')"
              log "============================================================"
            }

            main "$@"