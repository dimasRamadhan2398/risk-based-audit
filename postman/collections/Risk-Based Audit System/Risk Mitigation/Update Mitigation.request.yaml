$kind: http-request
name: Update Mitigation
method: PUT
url: '{{auth_base_url}}/api/v1/risk-mitigations/:id'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
pathVariables:
  - key: id
    value: MIT-001
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "mitigationPlan": "Updated plan",
      "supervisor": "Budi",
      "pic": "Dimas",
      "unitInCharge": "Financial",
      "start_date": "2026-01-01",
      "end_date": "2026-12-31",
      "notes": "Updated notes"
    }
