$kind: http-request
name: Create Audit Charter
method: POST
url: '{{auth_base_url}}/api/v1/audit-charters'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: formdata
  content:
    - key: title
      type: text
      value: ''
    - key: version
      type: text
      value: ''
    - key: date
      type: text
      value: ''
    - key: uploadedBy
      type: text
      value: ''
    - key: approvedBy
      type: text
      value: ''
    - key: isActive
      type: text
      value: ''
    - key: file
      type: file
      src: ''
