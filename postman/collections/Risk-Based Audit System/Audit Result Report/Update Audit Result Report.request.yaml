$kind: http-request
name: Update Audit Result Report
method: PUT
url: '{{auth_base_url}}/api/v1/audit-result-reports/:id'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
pathVariables:
  - key: id
    value: R-001
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "Final",
      "overallRating": "Satisfactory"
    }
