$kind: http-request
name: Update Action Taken Report
method: PUT
url: '{{auth_base_url}}/api/v1/action-taken-reports/:id'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
pathVariables:
  - key: id
    value: '1'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "completed",
      "progressDescription": "Action completed on time.",
      "attachment": "evidence.pdf"
    }
