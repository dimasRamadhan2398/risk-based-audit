$kind: http-request
name: Create QA Report
method: POST
url: '{{auth_base_url}}/api/v1/quality-assurance'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "type": "regular",
      "assessmentTitle": "Q1 2026 Internal QA",
      "periodQuarter": "Q1",
      "periodYear": "2026",
      "status": "in_progress",
      "result": "",
      "internalEvaluator": "Dimas"
    }
