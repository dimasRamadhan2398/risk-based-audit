$kind: http-request
name: Update QA Report
method: PUT
url: '{{auth_base_url}}/api/v1/quality-assurance/:id'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
pathVariables:
  - key: id
    value: qa-id-here
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "completed",
      "result": "4.5/5"
    }
