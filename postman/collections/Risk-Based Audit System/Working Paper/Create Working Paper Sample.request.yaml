$kind: http-request
name: Create Working Paper Sample
method: POST
url: '{{auth_base_url}}/api/v1/working-papers/samples'
order: 6000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "population": 100,
      "sampleSize": 25,
      "samples": [
        {
          "id": 1,
          "document": "Invoice INV-001",
          "l1": true,
          "l2": true,
          "l3": false
        }
      ],
      "conclusion": "25% sample tested, no material findings"
    }
