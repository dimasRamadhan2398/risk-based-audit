$kind: http-request
name: Create Activity Plan
method: POST
url: '{{auth_base_url}}/api/v1/audit-activity-plans'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "planTitle": "IT Audit Activity Plan 2026",
      "planYear": "2026",
      "planPeriodStart": "2026-01-01",
      "planPeriodEnd": "2026-12-31",
      "department": "IT",
      "createdBy": "Dimas",
      "creationDate": "2026-01-01"
    }
