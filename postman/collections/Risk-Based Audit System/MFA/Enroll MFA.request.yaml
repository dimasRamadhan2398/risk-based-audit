$kind: http-request
name: Enroll MFA
method: POST
url: '{{auth_base_url}}/api/v1/mfa/enroll'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "mfa_type": "totp"
    }
