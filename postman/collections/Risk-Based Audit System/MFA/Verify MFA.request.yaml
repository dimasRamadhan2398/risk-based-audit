$kind: http-request
name: Verify MFA
method: POST
url: '{{auth_base_url}}/api/v1/mfa/verify'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "code": "123456"
    }
