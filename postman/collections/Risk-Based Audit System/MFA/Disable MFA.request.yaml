$kind: http-request
name: Disable MFA
method: POST
url: '{{auth_base_url}}/api/v1/mfa/disable'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "password": "password123"
    }
