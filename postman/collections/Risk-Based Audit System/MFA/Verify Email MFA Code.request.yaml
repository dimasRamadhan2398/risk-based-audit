$kind: http-request
name: Verify Email MFA Code
method: POST
url: '{{auth_base_url}}/api/v1/mfa/verify-email-code'
order: 6000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "code": "123456"
    }
