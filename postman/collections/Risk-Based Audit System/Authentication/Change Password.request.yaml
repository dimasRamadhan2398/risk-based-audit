$kind: http-request
name: Change Password
method: POST
url: '{{auth_base_url}}/api/v1/auth/change-password'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "old_password": "oldpassword123",
      "new_password": "newpassword123"
    }
