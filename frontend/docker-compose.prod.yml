version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rbia-frontend-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8080/api/v1}
      - ANALYTICS_API_BASE_URL=${ANALYTICS_API_BASE_URL:-http://localhost:8080/api/analytics}
      - NUXT_PUBLIC_AUTH_SERVICE_BASE_URL=${NUXT_PUBLIC_AUTH_SERVICE_BASE_URL:-http://localhost:8080/api/v1}
      - NUXT_PUBLIC_AUDIT_SERVICE_BASE_URL=${NUXT_PUBLIC_AUDIT_SERVICE_BASE_URL:-http://localhost:8080/api/v1}
      - NUXT_PUBLIC_RISK_SERVICE_BASE_URL=${NUXT_PUBLIC_RISK_SERVICE_BASE_URL:-http://localhost:8080/api/v1}
      - NUXT_PUBLIC_MASTER_SERVICE_BASE_URL=${NUXT_PUBLIC_MASTER_SERVICE_BASE_URL:-http://localhost:8080/api/v1}
    networks:
      - rbia-network
    restart: unless-stopped

networks:
  rbia-network:
    driver: bridge
