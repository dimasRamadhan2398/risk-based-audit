services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rbia-frontend-dev
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - API_BASE_URL=${API_BASE_URL:-/api/v1}
      - ANALYTICS_API_BASE_URL=${ANALYTICS_API_BASE_URL:-/api/analytics}
      - NUXT_PUBLIC_AUTH_SERVICE_BASE_URL=${NUXT_PUBLIC_AUTH_SERVICE_BASE_URL:-/api/v1}
      - NUXT_PUBLIC_AUDIT_SERVICE_BASE_URL=${NUXT_PUBLIC_AUDIT_SERVICE_BASE_URL:-/api/v1}
      - NUXT_PUBLIC_RISK_SERVICE_BASE_URL=${NUXT_PUBLIC_RISK_SERVICE_BASE_URL:-/api/v1}
      - NUXT_PUBLIC_MASTER_SERVICE_BASE_URL=${NUXT_PUBLIC_MASTER_SERVICE_BASE_URL:-/api/v1}
      - API_BASE_URL_SERVER=${API_BASE_URL_SERVER:-http://rb_audit_kong_dev:8080/api/v1/**}
      - ANALYTICS_API_BASE_URL_SERVER=${ANALYTICS_API_BASE_URL_SERVER:-http://rb_audit_kong_dev:8080/api/analytics/**}
    networks:
      - rb_audit_network_dev
    restart: unless-stopped

networks:
  rb_audit_network_dev:
    name: rb_audit_network_dev
    external: true
