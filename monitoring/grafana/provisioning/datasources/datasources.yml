# =============================================================================
# Grafana Datasource Provisioning
# Auto-configure Prometheus and Loki as datasources on startup
# =============================================================================

apiVersion: 1

datasources:

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://rbia_prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://rbia_loki:3100
    editable: true
    jsonData:
      maxLines: 1000
