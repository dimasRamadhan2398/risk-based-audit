services:
  postgres:
    image: postgres:16
    container_name: rb_audit_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rb_audit
      GIN_MODE: release
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rb_audit_network

  redis:
    image: redis:7-alpine
    container_name: rb_audit_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rb_audit_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: rb_audit_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - rb_audit_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: rb_audit_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - rb_audit_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rb_audit_kafka_ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: rb-audit
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - rb_audit_network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: rb_audit_auth_service
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "8001:8001"
    # volumes:
    #   - ./auth-service/pkg/config/config.docker.yaml:/app/pkg/config/config.yaml:ro
    networks:
      - rb_audit_network
    restart: unless-stopped

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: rb_audit_analytics_service
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "8084:8084"
    networks:
      - rb_audit_network
    restart: unless-stopped

  audit-service:
    build:
      context: ./audit-service
      dockerfile: Dockerfile
    container_name: rb_audit_audit_service
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "8002:8001"
    networks:
      - rb_audit_network
    restart: unless-stopped

  master-service:
    build:
      context: ./master-service
      dockerfile: Dockerfile
    container_name: rb_audit_master_service
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "8003:8002"
    networks:
      - rb_audit_network
    restart: unless-stopped

  risk-service:
    build:
      context: ./risk-service
      dockerfile: Dockerfile
    container_name: rb_audit_risk_service
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "8004:8002"
    networks:
      - rb_audit_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  rb_audit_network:
    driver: bridge