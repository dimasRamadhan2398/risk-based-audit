name: rb_audit_backend

services:
  postgres:
    image: postgres:16
    container_name: rb_audit_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rb_audit
      GIN_MODE: release
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-databases.sql:/docker-entrypoint-initdb.d/init-multiple-databases.sql
    networks:
      - rb_audit_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rb_audit_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rb_audit_network
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: rb_audit_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD-SHELL", "cub zookeeper-ready localhost:2181 40 || exit 1"]
      interval: 10s
      timeout: 45s
      retries: 10
      start_period: 15s
    networks:
      - rb_audit_network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: rb_audit_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms128M"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAIN://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAIN://kafka:29092,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAIN:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAIN
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready 1 40 -b localhost:29092 || exit 1"]
      interval: 10s
      timeout: 45s
      retries: 10
      start_period: 30s
    networks:
      - rb_audit_network
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: rb_audit_auth_service
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8001:8001"
    command: sh -c "./auth --config ./pkg/config/config.yaml seed && ./auth --config ./pkg/config/config.yaml serve"
    networks:
      - rb_audit_network
    restart: unless-stopped

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: rb_audit_analytics_service
    environment:
      - PYTHON_AI_URL=http://python-ai:8000
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      python-ai:
        condition: service_started
    ports:
      - "8084:8084"
    networks:
      - rb_audit_network
    restart: unless-stopped

  audit-service:
    build:
      context: ./audit-service
      dockerfile: Dockerfile
    container_name: rb_audit_audit_service
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8002:8001"
    command: sh -c "./audit seed && ./audit serve"
    networks:
      - rb_audit_network
    restart: unless-stopped

  master-service:
    build:
      context: ./master-service
      dockerfile: Dockerfile
    container_name: rb_audit_master_service
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8003:8002"
    command: sh -c "./master seed && ./master serve"
    networks:
      - rb_audit_network
    restart: unless-stopped

  risk-service:
    build:
      context: ./risk-service
      dockerfile: Dockerfile
    container_name: rb_audit_risk_service
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8004:8002"
    command: sh -c "./risk up && ./risk serve"
    networks:
      - rb_audit_network
    restart: unless-stopped

  python-ai:
    build:
      context: ./python-ai
      dockerfile: Dockerfile
    container_name: rb_audit_python_ai
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - python_ai_models:/app/models
      - ../ai_model_training:/app/ai_model_training:ro
    networks:
      - rb_audit_network
    restart: unless-stopped

  kong:
    image: kong:3.4
    container_name: rb_audit_kong
    volumes:
      - ./kong-gateway:/usr/local/kong/declarative
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8080, 0.0.0.0:8443 ssl http2
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl http2
      KONG_LOG_LEVEL: info
      KONG_PLUGINS: bundled
      KONG_NGINX_WORKER_PROCESSES: 1
      KONG_NGINX_PROXY_PROXY_BUFFERING: "off"
    ports:
      - "8080:8080"
      - "8443:8443"
      - "8009:8001"
      - "8444:8444"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rb_audit_network
    restart: unless-stopped
    depends_on:
      - auth-service
      - audit-service
      - master-service
      - risk-service
      - analytics-service
      - python-ai

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  kafka_data:
  python_ai_models:

networks:
  rb_audit_network:
    name: rb_audit_network
    driver: bridge
