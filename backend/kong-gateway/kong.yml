_format_version: "3.0"
_transform: true

plugins:
  - name: cors
    config:
      origins:
        - "https://auditsphere.app"
        - "http://localhost:3000"
        - "http://202.10.34.166:3000"
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Content-Type
        - Authorization
        - X-Requested-With
        - accept
        - origin
        - Cache-Control
        - X-CSRF-Token
        - Access-Control-Allow-Origin
      exposed_headers:
        - Content-Length
        - Content-Type
        - Authorization
      credentials: true
      max_age: 3600
  - name: rate-limiting
    config:
      minute: 100
      hour: 5000
      policy: local
  - name: bot-detection
    config:
      allow:
        - "googlebot"           # Allowed bots (e.g. search engine crawlers)
        - "bingbot"
      deny:
        - "curl"                # Extra User-Agents to block
        - "python-requests"
        - "Go-http-client"
        - "sqlmap"
        - "nikto"
        - "nmap"


services:
  - name: auth-service
    url: http://auth-service:8001
    routes:
      - name: auth-routes-v1
        paths:
          - /api/v1/auth
          - /api/v1/users
          - /api/v1/roles
          - /api/v1/permissions
          - /api/v1/mfa
          - /api/v1/devices
          - /api/v1/confidentiality
        strip_path: false

  - name: auth-service-legacy-mfa
    url: http://auth-service:8001/api/v1/mfa
    routes:
      - name: auth-route-legacy-mfa
        paths:
          - /api/mfa
        strip_path: true

  - name: auth-service-legacy-devices
    url: http://auth-service:8001/api/v1/devices
    routes:
      - name: auth-route-legacy-devices
        paths:
          - /api/devices
        strip_path: true

  - name: audit-service
    url: http://audit-service:8001
    routes:
      - name: audit-routes
        paths:
          - /api/v1/audit-charters
          - /api/v1/audit-guidelines
          - /api/v1/audit-sops
          - /api/v1/audit-mandates
          - /api/v1/audit-assignments
          - /api/v1/audit-activities
          - /api/v1/annual-audit-plans
          - /api/v1/activity-plans
          - /api/v1/strategic-plans
          - /api/v1/assignment-letters
          - /api/v1/audit-executions
          - /api/v1/fieldwork
          - /api/v1/working-papers
          - /api/v1/audit-result-reports
          - /api/v1/auditee-surveys
          - /api/v1/executive-summaries
          - /api/v1/action-taken-reports
          - /api/v1/uploaded-plan-documents
          - /api/v1/uploaded-annual-plans
          - /api/v1/uploaded-assignment-letters
          - /api/v1/uploaded-audit-result-reports
          - /api/v1/uploaded-executive-summaries
          - /api/v1/uploaded-executive-summary-reports
          - /api/v1/uploaded-consulting-documents
          - /api/v1/uploaded-performance-reports
          - /api/v1/media
          - /api/v1/performance
          - /uploads
        strip_path: false

  - name: master-service
    url: http://master-service:8002
    routes:
      - name: master-routes
        paths:
          - /api/v1/companies
          - /api/v1/business-units
          - /api/v1/departments
          - /api/v1/quality-assurance
          - /api/v1/vision-mission-goals
          - /api/v1/data-sources
        strip_path: false

  - name: risk-service
    url: http://risk-service:8002
    routes:
      - name: risk-routes
        paths:
          - /api/v1/risks
          - /api/v1/mitigations
          - /api/v1/risk-factors
          - /api/v1/audit-universe
        strip_path: false

  - name: analytics-service
    url: http://analytics-service:8084
    routes:
      - name: analytics-routes
        paths:
          - /api/analytics
        strip_path: false

  - name: python-ai-service
    url: http://python-ai:8000
    routes:
      - name: python-ai-routes
        paths:
          - /api/python-ai
        strip_path: true
