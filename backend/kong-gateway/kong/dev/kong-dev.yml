_format_version: "3.0"
_transform: true

# ============================================================
# GLOBAL PLUGINS
# ============================================================

plugins:

  # ----------------------------------------------------------
  # PROMETHEUS METRICS
  # ----------------------------------------------------------
  - name: prometheus
    config:
      per_consumer: false
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

  # ----------------------------------------------------------
  # CORS
  # ----------------------------------------------------------
  - name: cors
    config:
      origins:
        - "https://dev.auditsphere.app"
        - "http://localhost:3000"
        - "http://localhost:3001"

      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS

      headers:
        - Accept
        - Authorization
        - Cache-Control
        - Content-Type
        - Origin
        - X-Requested-With
        - X-CSRF-Token

      exposed_headers:
        - Content-Length
        - Content-Type
        - Authorization

      credentials: true

      max_age: 3600


  # ----------------------------------------------------------
  # RATE LIMITING
  # ----------------------------------------------------------
  # Development dibuat lebih longgar karena banyak request
  # dari hot reload, Postman, Swagger, automated testing, dll.
  # ----------------------------------------------------------
  - name: rate-limiting
    config:
      minute: 300
      hour: 20000
      policy: local


  # ----------------------------------------------------------
  # BOT DETECTION
  # ----------------------------------------------------------
  # Untuk DEV jangan terlalu agresif.
  #
  # curl / python-requests / Go-http-client sengaja tidak
  # diblokir karena sering digunakan untuk development/testing.
  # ----------------------------------------------------------
  - name: bot-detection
    config:
      allow:
        - "googlebot"
        - "bingbot"

      deny:
        - "sqlmap"
        - "nikto"
        - "nmap"


# ============================================================
# UPSTREAMS (Load Balancing Targets)
# ============================================================

upstreams:

  # Development uses single instances of each service
  # In production, add more targets with appropriate weights

  - name: auth-service-upstream
    algorithm: round_robin
    slots: 10
    healthchecks:
      active:
        https_verify_certificate: false
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
        type: http
        http_path: /api/v1/health
        timeout: 1
      passive:
        healthy:
          http_statuses: [200, 201, 204, 301, 302, 304, 307, 308]
          successes: 5
        unhealthy:
          http_failures: 5
          tcp_failures: 5
          timeouts: 5
    targets:
      - target: auth-service:8001
        weight: 100

  - name: audit-service-upstream
    algorithm: least_connections
    slots: 20
    healthchecks:
      active:
        https_verify_certificate: false
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
        type: http
        http_path: /api/v1/health
        timeout: 1
      passive:
        healthy:
          http_statuses: [200, 201, 204, 301, 302, 304, 307, 308]
          successes: 5
        unhealthy:
          http_failures: 5
          tcp_failures: 5
          timeouts: 5
    targets:
      - target: audit-service:8001
        weight: 100

  - name: master-service-upstream
    algorithm: round_robin
    slots: 15
    healthchecks:
      active:
        https_verify_certificate: false
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
        type: http
        http_path: /api/v1/health
        timeout: 1
      passive:
        healthy:
          http_statuses: [200, 201, 204, 301, 302, 304, 307, 308]
          successes: 5
        unhealthy:
          http_failures: 5
          tcp_failures: 5
          timeouts: 5
    targets:
      - target: master-service:8002
        weight: 100

  - name: risk-service-upstream
    algorithm: round_robin
    slots: 10
    healthchecks:
      active:
        https_verify_certificate: false
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
        type: http
        http_path: /api/v1/health
        timeout: 1
      passive:
        healthy:
          http_statuses: [200, 201, 204, 301, 302, 304, 307, 308]
          successes: 5
        unhealthy:
          http_failures: 5
          tcp_failures: 5
          timeouts: 5
    targets:
      - target: risk-service:8002
        weight: 100

  - name: analytics-service-upstream
    algorithm: least_connections
    slots: 25
    healthchecks:
      active:
        https_verify_certificate: false
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
        type: http
        http_path: /api/analytics/health
        timeout: 1
      passive:
        healthy:
          http_statuses: [200, 201, 204, 301, 302, 304, 307, 308]
          successes: 5
        unhealthy:
          http_failures: 5
          tcp_failures: 5
          timeouts: 5
    targets:
      - target: analytics-service:8084
        weight: 100

  - name: python-ai-upstream
    algorithm: round_robin
    slots: 10
    healthchecks:
      active:
        https_verify_certificate: false
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
        type: http
        http_path: /health
        timeout: 1
      passive:
        healthy:
          http_statuses: [200, 201, 204, 301, 302, 304, 307, 308]
          successes: 5
        unhealthy:
          http_failures: 5
          tcp_failures: 5
          timeouts: 5
    targets:
      - target: python-ai:8000
        weight: 100


# ============================================================
# SERVICES
# ============================================================

services:

  # ==========================================================
  # AUTH SERVICE
  # ==========================================================

  - name: auth-service
    upstream: auth-service-upstream

    routes:

      - name: auth-routes-v1
        paths:
          - /api/v1/auth
          - /api/v1/users
          - /api/v1/roles
          - /api/v1/permissions
          - /api/v1/mfa
          - /api/v1/devices
          - /api/v1/confidentiality
          - /api/v1/resend

        strip_path: false


  # ----------------------------------------------------------
  # LEGACY MFA
  # ----------------------------------------------------------

  - name: auth-service-legacy-mfa
    upstream: auth-service-upstream

    routes:

      - name: auth-route-legacy-mfa
        paths:
          - /api/mfa

        strip_path: true


  # ----------------------------------------------------------
  # LEGACY DEVICES
  # ----------------------------------------------------------

  - name: auth-service-legacy-devices
    upstream: auth-service-upstream

    routes:

      - name: auth-route-legacy-devices
        paths:
          - /api/devices

        strip_path: true


  # ==========================================================
  # AUDIT SERVICE
  # ==========================================================

  - name: audit-service
    upstream: audit-service-upstream

    routes:

      - name: audit-routes

        paths:

          # Audit Charter / Governance
          - /api/v1/audit-charters
          - /api/v1/audit-guidelines
          - /api/v1/audit-sops
          - /api/v1/audit-mandates

          # Audit Planning
          - /api/v1/audit-assignments
          - /api/v1/audit-activities
          - /api/v1/annual-audit-plans
          - /api/v1/activity-plans
          - /api/v1/strategic-plans
          - /api/v1/assignment-letters

          # Audit Execution
          - /api/v1/audit-executions
          - /api/v1/fieldwork
          - /api/v1/working-papers

          # Audit Results
          - /api/v1/audit-result-reports
          - /api/v1/auditee-surveys
          - /api/v1/executive-summaries
          - /api/v1/action-taken-reports

          # Documents
          - /api/v1/uploaded-plan-documents
          - /api/v1/uploaded-annual-plans
          - /api/v1/uploaded-assignment-letters
          - /api/v1/uploaded-audit-result-reports
          - /api/v1/uploaded-executive-summaries
          - /api/v1/uploaded-executive-summary-reports
          - /api/v1/uploaded-consulting-documents
          - /api/v1/uploaded-performance-reports

          # Media
          - /api/v1/media
          - /uploads

          # Performance
          - /api/v1/performance

        strip_path: false

        # Rate limiting per route for audit endpoints (more relaxed for dev)
        plugins:
          - name: rate-limiting
            config:
              minute: 300
              hour: 10000
              policy: local
              limit_by: ip
              hide_client_headers: false

          # Response caching for audit GET endpoints (shorter TTL for dev)
          - name: proxy-cache
            config:
              content_type:
                - application/json
              cache_ttl: 60
              cache_control: true
              vary_headers:
                - Accept-Encoding


  # ==========================================================
  # MASTER SERVICE
  # ==========================================================

  - name: master-service
    upstream: master-service-upstream

    routes:

      - name: master-routes

        paths:

          # Organization
          - /api/v1/companies
          - /api/v1/business-units
          - /api/v1/departments
          - /api/v1/employees
          - /api/v1/job-roles
          - /api/v1/locations

          # Quality Assurance
          - /api/v1/quality-assurance

          # Consulting
          - /api/v1/consulting-services

          # Corporate Strategy
          - /api/v1/vision-mission-goals

          # Data Sources
          - /api/v1/data-sources

        strip_path: false

        # Caching for master data lookups
        plugins:
          - name: proxy-cache
            config:
              content_type:
                - application/json
              cache_ttl: 120
              cache_control: true
              vary_headers:
                - Accept-Encoding


  # ==========================================================
  # RISK SERVICE
  # ==========================================================

  - name: risk-service
    upstream: risk-service-upstream

    routes:

      - name: risk-routes

        paths:

          # Risk Management
          - /api/v1/risks
          - /api/v1/mitigations
          - /api/v1/risk-factors

          # Audit Universe
          - /api/v1/audit-universe

          # Risk Appetite
          - /api/v1/risk-appetite

          # Risk & Control Matrix
          - /api/v1/rcm

        strip_path: false

        # Caching for risk data
        plugins:
          - name: proxy-cache
            config:
              content_type:
                - application/json
              cache_ttl: 120
              cache_control: true
              vary_headers:
                - Accept-Encoding


  # ==========================================================
  # ANALYTICS SERVICE (Dashboard Critical Path)
  # ==========================================================

  - name: analytics-service
    upstream: analytics-service-upstream

    routes:

      - name: analytics-routes-cached

        paths:
          - /api/analytics/report
          - /api/analytics/predict
          - /api/analytics/risk-score
          - /api/analytics/risk-score/batch
          - /api/analytics/anomaly
          - /api/analytics/anomaly/batch
          - /api/analytics/text-analysis
          - /api/analytics/text-analysis/batch
          - /api/analytics/performance-trend
          - /api/analytics/performance-trend/batch
          - /api/analytics/caatt

        strip_path: false

        # Dashboard-specific caching: moderate TTL for dev
        plugins:
          - name: rate-limiting
            config:
              minute: 300
              hour: 5000
              policy: local
              limit_by: ip
              hide_client_headers: false

          # Caching for dashboard queries (shorter TTL in dev)
          - name: proxy-cache
            config:
              content_type:
                - application/json
              cache_ttl: 120
              cache_control: true
              vary_headers:
                - Accept-Encoding
              response_headers:
                - X-Cache

      - name: analytics-routes-retrain

        paths:
          - /api/analytics/retrain/auto

        strip_path: false

        # Retrain endpoint: no caching
        plugins:
          - name: rate-limiting
            config:
              minute: 30
              hour: 300
              policy: local
              limit_by: ip


  # ==========================================================
  # PYTHON AI SERVICE
  # ==========================================================

  - name: python-ai-service
    upstream: python-ai-upstream

    routes:

      - name: python-ai-routes

        paths:
          - /api/python-ai

        strip_path: true