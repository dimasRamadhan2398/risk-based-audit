_format_version: "3.0"
_transform: true

# ============================================================
# GLOBAL PLUGINS
# ============================================================

plugins:

  # ==========================================================
  # CORS
  # ==========================================================
  #
  # Only allow the production frontend.
  #
  # IMPORTANT:
  # - Do NOT use "*"
  # - Do NOT include Access-Control-Allow-Origin in headers
  # - credentials=true requires explicit origins
  #
  # ==========================================================

  - name: prometheus
    config:
      per_consumer: false
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

  - name: cors
    config:
      origins:
        - "https://auditsphere.app"

      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS

      headers:
        - Accept
        - Authorization
        - Cache-Control
        - Content-Type
        - Origin
        - X-Requested-With
        - X-CSRF-Token

      exposed_headers:
        - Content-Length
        - Content-Type
        - Authorization

      credentials: true

      max_age: 3600


  # ==========================================================
  # GLOBAL RATE LIMITING
  # ==========================================================
  #
  # Baseline protection against:
  # - abuse
  # - accidental request storms
  # - scraping
  # - excessive API usage
  #
  # For multi-node Kong, consider Redis/cluster policy.
  #
  # ==========================================================

  - name: rate-limiting
    config:
      minute: 100
      hour: 5000
      policy: local
      limit_by: ip


  # ==========================================================
  # BOT DETECTION
  # ==========================================================
  #
  # Production is stricter than DEV.
  #
  # NOTE:
  # curl/python/Go clients are intentionally NOT blocked here.
  # Blocking them globally can interfere with legitimate
  # integrations, monitoring, CI/CD and API clients.
  #
  # ==========================================================

  - name: bot-detection
    config:
      allow:
        - "googlebot"
        - "bingbot"

      deny:
        - "sqlmap"
        - "nikto"
        - "nmap"


# ============================================================
# UPSTREAMS (Load Balancing Targets)
# ============================================================

upstreams:

  # ============================================================
  # AUTH SERVICE UPSTREAM
  # ============================================================
  - name: auth-service-upstream
    algorithm: round-robin
    slots: 10
    healthchecks:
      active:
        https_verify_certificate: false
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
        type: http
        http_path: /api/v1/health
        timeout: 1
      passive:
        healthy:
          http_statuses: [200, 201, 204, 301, 302, 304, 307, 308]
          successes: 5
        unhealthy:
          http_failures: 5
          tcp_failures: 5
          timeouts: 5
    targets:
      - target: auth-service:8001
        weight: 100

  # ============================================================
  # AUDIT SERVICE UPSTREAM (Dashboard Heavy)
  # ============================================================
  - name: audit-service-upstream
    algorithm: least-connections
    slots: 20
    healthchecks:
      active:
        https_verify_certificate: false
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
        type: http
        http_path: /api/v1/health
        timeout: 1
      passive:
        healthy:
          http_statuses: [200, 201, 204, 301, 302, 304, 307, 308]
          successes: 5
        unhealthy:
          http_failures: 5
          tcp_failures: 5
          timeouts: 5
    targets:
      - target: audit-service:8001
        weight: 100

  # ============================================================
  # MASTER SERVICE UPSTREAM (Dashboard Lookups)
  # ============================================================
  - name: master-service-upstream
    algorithm: round-robin
    slots: 15
    healthchecks:
      active:
        https_verify_certificate: false
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
        type: http
        http_path: /api/v1/health
        timeout: 1
      passive:
        healthy:
          http_statuses: [200, 201, 204, 301, 302, 304, 307, 308]
          successes: 5
        unhealthy:
          http_failures: 5
          tcp_failures: 5
          timeouts: 5
    targets:
      - target: master-service:8002
        weight: 100

  # ============================================================
  # RISK SERVICE UPSTREAM
  # ============================================================
  - name: risk-service-upstream
    algorithm: round-robin
    slots: 10
    healthchecks:
      active:
        https_verify_certificate: false
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
        type: http
        http_path: /api/v1/health
        timeout: 1
      passive:
        healthy:
          http_statuses: [200, 201, 204, 301, 302, 304, 307, 308]
          successes: 5
        unhealthy:
          http_failures: 5
          tcp_failures: 5
          timeouts: 5
    targets:
      - target: risk-service:8002
        weight: 100

  # ============================================================
  # ANALYTICS SERVICE UPSTREAM (Dashboard Critical)
  # ============================================================
  - name: analytics-service-upstream
    algorithm: least-connections
    slots: 25
    healthchecks:
      active:
        https_verify_certificate: false
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
        type: http
        http_path: /api/analytics/health
        timeout: 1
      passive:
        healthy:
          http_statuses: [200, 201, 204, 301, 302, 304, 307, 308]
          successes: 5
        unhealthy:
          http_failures: 5
          tcp_failures: 5
          timeouts: 5
    targets:
      - target: analytics-service:8084
        weight: 100

  # ============================================================
  # PYTHON AI SERVICE UPSTREAM
  # ============================================================
  - name: python-ai-upstream
    algorithm: round-robin
    slots: 10
    healthchecks:
      active:
        https_verify_certificate: false
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
        type: http
        http_path: /health
        timeout: 1
      passive:
        healthy:
          http_statuses: [200, 201, 204, 301, 302, 304, 307, 308]
          successes: 5
        unhealthy:
          http_failures: 5
          tcp_failures: 5
          timeouts: 5
    targets:
      - target: python-ai:8000
        weight: 100


# ============================================================
# SERVICES
# ============================================================

services:

  # ==========================================================
  # AUTH SERVICE
  # ==========================================================

  - name: auth-service
    host: auth-service-upstream
    protocol: http
    port: 8001

    routes:

      - name: auth-routes-v1

        paths:
          - /api/v1/auth
          - /api/v1/users
          - /api/v1/roles
          - /api/v1/permissions
          - /api/v1/mfa
          - /api/v1/devices
          - /api/v1/confidentiality
          - /api/v1/resend

        strip_path: false


  # ==========================================================
  # LEGACY MFA
  # ==========================================================

  - name: auth-service-legacy-mfa
    host: auth-service-upstream
    protocol: http
    port: 8001
    # strip_path below removes /api/mfa, so the service must re-add the real
    # prefix or requests arrive at the upstream as bare /<rest>.
    path: /api/v1/mfa

    routes:

      - name: auth-route-legacy-mfa

        paths:
          - /api/mfa

        strip_path: true


  # ==========================================================
  # LEGACY DEVICES
  # ==========================================================

  - name: auth-service-legacy-devices
    host: auth-service-upstream
    protocol: http
    port: 8001
    path: /api/v1/devices

    routes:

      - name: auth-route-legacy-devices

        paths:
          - /api/devices

        strip_path: true


  # ==========================================================
  # AUDIT SERVICE
  # ==========================================================

  - name: audit-service
    host: audit-service-upstream
    protocol: http
    port: 8001

    routes:

      - name: audit-routes

        paths:

          # --------------------------------------------------
          # Audit Governance
          # --------------------------------------------------

          - /api/v1/audit-charters
          - /api/v1/audit-guidelines
          - /api/v1/audit-sops
          - /api/v1/audit-mandates

          # --------------------------------------------------
          # Audit Planning
          # --------------------------------------------------

          - /api/v1/audit-assignments
          - /api/v1/audit-activities
          - /api/v1/annual-audit-plans
          - /api/v1/activity-plans
          - /api/v1/strategic-plans
          - /api/v1/assignment-letters

          # --------------------------------------------------
          # Audit Execution
          # --------------------------------------------------

          - /api/v1/audit-executions
          - /api/v1/fieldwork
          - /api/v1/working-papers

          # --------------------------------------------------
          # Audit Results
          # --------------------------------------------------

          - /api/v1/audit-result-reports
          - /api/v1/auditee-surveys
          - /api/v1/executive-summaries
          - /api/v1/action-taken-reports

          # --------------------------------------------------
          # Documents
          # --------------------------------------------------

          - /api/v1/uploaded-plan-documents
          - /api/v1/uploaded-annual-plans
          - /api/v1/uploaded-assignment-letters
          - /api/v1/uploaded-audit-result-reports
          - /api/v1/uploaded-executive-summaries
          - /api/v1/uploaded-executive-summary-reports
          - /api/v1/uploaded-consulting-documents
          - /api/v1/uploaded-performance-reports

          # --------------------------------------------------
          # Media
          # --------------------------------------------------

          - /api/v1/media
          - /uploads

          # --------------------------------------------------
          # Performance
          # --------------------------------------------------

          - /api/v1/performance

        strip_path: false

        # Rate limiting per route for fieldwork endpoints
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              hour: 1000
              policy: local
              limit_by: ip
              hide_client_headers: false

          # Response caching for GET endpoints
          # Cache on audit-service is optimized for fieldwork with short TTL (5 min)
          - name: proxy-cache
            config:
              strategy: memory
              content_type:
                - application/json
              cache_ttl: 300
              cache_control: true
              # Authorization MUST stay in the cache key. Kong has no jwt/key-auth
              # plugin here, so a cache hit is served without ever reaching the
              # upstream auth middleware - dropping it leaks authenticated
              # responses to anonymous callers.
              vary_headers:
                - Authorization
                - Accept-Encoding


  # ==========================================================
  # MASTER SERVICE
  # ==========================================================

  - name: master-service
    host: master-service-upstream
    protocol: http
    port: 8002

    routes:

      - name: master-routes

        paths:

          - /api/v1/companies
          - /api/v1/business-units
          - /api/v1/departments
          - /api/v1/employees
          - /api/v1/job-roles
          - /api/v1/locations
          - /api/v1/quality-assurance
          - /api/v1/consulting-services
          - /api/v1/vision-mission-goals
          - /api/v1/data-sources

        strip_path: false

        # Caching for master data lookups (used by dashboard)
        plugins:
          - name: proxy-cache
            config:
              strategy: memory
              content_type:
                - application/json
              cache_ttl: 600
              cache_control: true
              # Authorization MUST stay in the cache key. Kong has no jwt/key-auth
              # plugin here, so a cache hit is served without ever reaching the
              # upstream auth middleware - dropping it leaks authenticated
              # responses to anonymous callers.
              vary_headers:
                - Authorization
                - Accept-Encoding


  # ==========================================================
  # RISK SERVICE
  # ==========================================================

  - name: risk-service
    host: risk-service-upstream
    protocol: http
    port: 8002

    routes:

      - name: risk-routes

        paths:

          - /api/v1/risks
          - /api/v1/mitigations
          - /api/v1/risk-factors
          - /api/v1/audit-universe
          - /api/v1/risk-appetite
          - /api/v1/rcm

        strip_path: false

        # Caching for risk data (dashboard feeds)
        plugins:
          - name: proxy-cache
            config:
              strategy: memory
              content_type:
                - application/json
              cache_ttl: 300
              cache_control: true
              # Authorization MUST stay in the cache key. Kong has no jwt/key-auth
              # plugin here, so a cache hit is served without ever reaching the
              # upstream auth middleware - dropping it leaks authenticated
              # responses to anonymous callers.
              vary_headers:
                - Authorization
                - Accept-Encoding


  # ==========================================================
  # ANALYTICS SERVICE (Dashboard Critical Path)
  # ==========================================================

  - name: analytics-service
    host: analytics-service-upstream
    protocol: http
    port: 8084

    routes:

      - name: analytics-routes-cached

        paths:
          - /api/analytics/report
          - /api/analytics/predict
          - /api/analytics/risk-score
          - /api/analytics/risk-score/batch
          - /api/analytics/anomaly
          - /api/analytics/anomaly/batch
          - /api/analytics/text-analysis
          - /api/analytics/text-analysis/batch
          - /api/analytics/performance-trend
          - /api/analytics/performance-trend/batch
          - /api/analytics/caatt

        strip_path: false

        # Dashboard-specific caching: longer TTL for aggregates
        plugins:
          - name: rate-limiting
            config:
              minute: 120
              hour: 3600
              policy: local
              limit_by: ip
              hide_client_headers: false

          # Aggressive caching for dashboard queries
          # Most dashboard endpoints are idempotent GET requests
          - name: proxy-cache
            config:
              strategy: memory
              content_type:
                - application/json
              cache_ttl: 600  # 10 minutes for dashboard aggregates
              cache_control: true
              # Authorization MUST stay in the cache key. Kong has no jwt/key-auth
              # plugin here, so a cache hit is served without ever reaching the
              # upstream auth middleware - dropping it leaks authenticated
              # responses to anonymous callers.
              vary_headers:
                - Authorization
                - Accept-Encoding
              response_headers:
                X-Cache-Status: true

      - name: analytics-routes-retrain

        paths:
          - /api/analytics/retrain/auto

        strip_path: false

        # Retrain endpoint: no caching (POST, state-changing)
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              hour: 100
              policy: local
              limit_by: ip


  # ==========================================================
  # PYTHON AI SERVICE
  # ==========================================================

  - name: python-ai-service
    host: python-ai-upstream
    protocol: http
    port: 8000

    routes:

      - name: python-ai-routes

        paths:
          - /api/python-ai

        strip_path: true