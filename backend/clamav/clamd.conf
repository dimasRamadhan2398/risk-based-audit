# clamd configuration for the AuditSphere upload scanner sidecar.
# Mounted read-only at /etc/clamav/clamd.conf by the clamav service in docker-compose.prod.yml.
# Services reach clamd over TCP (INSTREAM) at clamav:3310 on rb_audit_network;
# the port is never published on the host.

LogFile /var/log/clamav/clamd.log
LogTime yes
LogClean no
LogVerbose no
# Also log to stdout so `docker logs` shows detections.
Foreground yes
LogSyslog no

# The image's /init and healthcheck (clamdcheck.sh) expect this socket.
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav

DatabaseDirectory /var/lib/clamav

# Uploads are capped at 10 MB by the services; the stream limit leaves room.
# A stream above the limit gets "INSTREAM size limit exceeded. ERROR", which
# the services treat as "not scanned" (refused in CLAMAV_MODE=required).
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M
MaxThreads 4
ReadTimeout 60
CommandReadTimeout 30
MaxQueue 50

# Reload signatures in place instead of loading a second copy alongside the
# first. That avoids doubling RAM (about 1 GB extra) during each freshclam
# update; scans block for the few seconds the reload takes.
ConcurrentDatabaseReload no
SelfCheck 3600

# Detection
DetectPUA no
ScanPE yes
ScanELF yes
ScanOLE2 yes
OLE2BlockMacros no
ScanPDF yes
ScanHTML yes
ScanArchive yes
AlertBrokenExecutables no
AlertEncrypted no
AlertOLE2Macros no
HeuristicAlerts yes
Bytecode yes
