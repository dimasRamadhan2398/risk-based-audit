definitions:
  models.ActivityPlanResponse:
    properties:
      annual_plan_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      objective:
        type: string
      planned_end:
        type: string
      planned_start:
        type: string
      project_code:
        type: string
      scope:
        type: string
      status:
        type: string
      target_unit_id:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.AssignmentStatus:
    enum:
    - pending
    - assigned
    - accepted
    - completed
    - rejected
    type: string
    x-enum-varnames:
    - AssignmentStatusPending
    - AssignmentStatusAssigned
    - AssignmentStatusAccepted
    - AssignmentStatusCompleted
    - AssignmentStatusRejected
  models.AuditAssignmentResponse:
    properties:
      assignment_title:
        type: string
      audit_plan_id:
        type: string
      auditor_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      end_date:
        type: string
      id:
        type: string
      notes:
        type: string
      start_date:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  models.AuditCharterResponse:
    properties:
      content:
        type: string
      created_at:
        type: string
      filename:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      title:
        type: string
      updated_at:
        type: string
      version:
        type: string
    type: object
  models.AuditMandateResponse:
    properties:
      created_at:
        type: string
      effective_date:
        type: string
      expiry_date:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      legal_basis:
        type: string
      mandate_source:
        type: string
      reference_number:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.CreateActivityPlanRequest:
    properties:
      annual_plan_id:
        type: string
      objective:
        type: string
      planned_end:
        type: string
      planned_start:
        type: string
      project_code:
        maxLength: 50
        type: string
      scope:
        type: string
      status:
        maxLength: 50
        type: string
      target_unit_id:
        type: string
      title:
        maxLength: 255
        type: string
    required:
    - annual_plan_id
    - planned_end
    - planned_start
    - project_code
    - target_unit_id
    - title
    type: object
  models.CreateAuditAssignmentRequest:
    properties:
      assignment_title:
        maxLength: 200
        type: string
      audit_plan_id:
        type: string
      auditor_id:
        type: string
      description:
        type: string
      end_date:
        type: string
      notes:
        type: string
      start_date:
        type: string
    required:
    - assignment_title
    - audit_plan_id
    - auditor_id
    type: object
  models.CreateAuditCharterRequest:
    properties:
      content:
        type: string
      filename:
        maxLength: 200
        type: string
      title:
        maxLength: 200
        type: string
      version:
        maxLength: 20
        type: string
    required:
    - content
    - filename
    - title
    - version
    type: object
  models.CreateAuditMandateRequest:
    properties:
      effective_date:
        type: string
      expiry_date:
        type: string
      legal_basis:
        type: string
      mandate_source:
        maxLength: 100
        type: string
      reference_number:
        maxLength: 100
        type: string
      title:
        maxLength: 200
        type: string
    required:
    - effective_date
    - reference_number
    - title
    type: object
  models.UpdateActivityPlanRequest:
    properties:
      objective:
        type: string
      planned_end:
        type: string
      planned_start:
        type: string
      scope:
        type: string
      status:
        maxLength: 50
        type: string
      target_unit_id:
        type: string
      title:
        maxLength: 255
        type: string
    type: object
  models.UpdateAssignmentStatusRequest:
    properties:
      status:
        $ref: '#/definitions/models.AssignmentStatus'
    required:
    - status
    type: object
  models.UpdateAuditAssignmentRequest:
    properties:
      assignment_title:
        maxLength: 200
        type: string
      description:
        type: string
      end_date:
        type: string
      notes:
        type: string
      start_date:
        type: string
    type: object
  models.UpdateAuditCharterRequest:
    properties:
      content:
        type: string
      filename:
        maxLength: 200
        type: string
      title:
        maxLength: 200
        type: string
    type: object
  models.UpdateAuditMandateRequest:
    properties:
      effective_date:
        type: string
      expiry_date:
        type: string
      is_active:
        type: boolean
      legal_basis:
        type: string
      mandate_source:
        maxLength: 100
        type: string
      title:
        maxLength: 200
        type: string
    type: object
  response.ErrorDetail:
    properties:
      code:
        type: string
      details:
        type: string
      message:
        type: string
    type: object
  response.Response:
    properties:
      data: {}
      error:
        $ref: '#/definitions/response.ErrorDetail'
      message:
        type: string
      success:
        type: boolean
    type: object
