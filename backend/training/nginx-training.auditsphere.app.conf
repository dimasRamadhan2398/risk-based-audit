# /etc/nginx/conf.d/training.auditsphere.app.conf
# Training environment -> rbia-frontend-training on 127.0.0.1:3020.
# The frontend proxies /api/v1, /api/analytics, /api/python-ai and /uploads
# internally to the training Kong / python-ai, so no api-training host exists.
# TLS lines are added by `certbot --nginx -d training.auditsphere.app`.

map $upstream_http_content_type $training_html_cache_control {
    ~*^text/html  "no-cache";
    default       "";
}

server {
    listen 80;
    server_name training.auditsphere.app;

    client_max_body_size 100m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Same images as prod, so prod's chunk archive covers stale tabs here too (read-only)
    location /_nuxt/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 404 = @training_chunk_archive;
    }

    location @training_chunk_archive {
        root /var/www/auditsphere-chunk-archive;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control $training_html_cache_control always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
