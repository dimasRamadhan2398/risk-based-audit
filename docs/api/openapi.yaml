components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from `POST /api/v1/auth/login` (or `/api/v1/auth/verify-mfa-login` when MFA is on), field `data.token`.
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
      description: The same JWT in a cookie. Accepted by audit-service (also `auth-token`, `token`), risk-service and analytics-service
        (also `token`).
    tokenQuery:
      type: apiKey
      in: query
      name: token
      description: The same JWT as a query parameter. audit-service only (file view/download links). Tokens in URLs end up
        in access logs; prefer the header.
    pythonAiApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Only enforced when python-ai's `API_KEY` env var is set (it is not set in any compose file today). `/health`,
        `/docs` and `/openapi.json` are always open.
  responses:
    Unauthorized:
      description: Missing, malformed or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/common.ErrorEnvelope'
    RateLimited:
      description: Rejected by Kong's rate-limiting plugin
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: API rate limit exceeded
  schemas:
    common.Envelope:
      type: object
      description: Success envelope used by auth-, audit-, master- and risk-service (`pkg/response`).
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          description: Payload; shape depends on the operation
    common.ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          description: master-service mirrors error.code here
        error:
          type: object
          properties:
            code:
              type: string
              example: BAD_REQUEST
            message:
              type: string
            details:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
              description: master-service validation errors, field name -> code (REQUIRED, INVALID_FORMAT, ALREADY_EXISTS)
        message:
          type: string
          description: Some audit-service handlers answer `{success:false, message}` instead of `error`
    common.Message:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
    common.Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 20
        total:
          type: integer
          example: 57
        total_pages:
          type: integer
          example: 3
    common.AnalyticsEnvelope:
      type: object
      description: analytics-service success shape
      properties:
        status:
          type: string
          example: success
        data: {}
    analytics.Anomaly:
      type: object
      properties:
        id:
          type: string
        entity:
          type: string
        type:
          type: string
        description:
          type: string
        severity:
          type: string
        date:
          type: string
        amount:
          type: number
        risk_level:
          type: string
        xMetric:
          type: number
