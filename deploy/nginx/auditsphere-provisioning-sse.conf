# /etc/nginx/snippets/auditsphere-provisioning-sse.conf
#
# Site Generator job progress (Server-Sent Events) for the control plane.
# Include it inside the server { } block of every control-plane vhost the
# Site Generator is opened from (auditsphere.app; the api vhost too if there is
# one), next to the other location blocks:
#
#     include /etc/nginx/snippets/auditsphere-provisioning-sse.conf;
#
# A regex location wins over the prefix `location /`, so only the event
# stream takes this path. It goes straight to the control-plane Kong on
# 127.0.0.1:8080 rather than through the Nuxt server's /api/v1 proxy: one
# hop fewer that could buffer or time out the stream. Kong routes it to
# auth-service (route provisioning-routes-v1, read_timeout 1h, response
# buffering off), which checks the JWT and proxies to the host provisioner.
#
# Every other /api/v1/provisioning call (create job, get job, list, ports) is
# a normal request and keeps using the existing location /.
#
# After installing: nginx -t && systemctl reload nginx

location ~ ^/api/v1/provisioning/jobs/[^/]+/events$ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Stream each event as it arrives.
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    # Tells any proxy in front of this one (a CDN, a second nginx) not to
    # buffer either.
    add_header X-Accel-Buffering no always;

    # A job can run for many minutes. The provisioner and auth-service keep
    # the stream alive; these only cap a dead connection.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
