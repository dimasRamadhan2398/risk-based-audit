# ============================================================================
# AuditSphere Data Hub — PostgreSQL 16 + TimescaleDB Base Configuration
# Common settings for high-throughput streaming, analytical queries & TimescaleDB
# ============================================================================

# ─── Connectivity & Pooler Defaults ──────────────────────────────────────────
listen_addresses = '*'
max_connections = 100
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 10

# ─── Preloaded Libraries ─────────────────────────────────────────────────────
shared_preload_libraries = 'timescaledb'
timescaledb.max_background_workers = 4

# ─── Storage, Disk & WAL Optimization ─────────────────────────────────────────
random_page_cost = 1.1
effective_io_concurrency = 200
checkpoint_completion_target = 0.9
wal_compression = lz4
default_toast_compression = lz4
synchronous_commit = off
min_wal_size = 1GB
max_wal_size = 4GB

# ─── Planner & Memory Execution ──────────────────────────────────────────────
jit = off
track_io_timing = on
track_functions = pl

# ─── Logging & Diagnostics ───────────────────────────────────────────────────
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on
log_temp_files = 10240

# ─── Autovacuum Tuning for High-Volume Append ─────────────────────────────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 500

# Dynamic overrides from autotune.sh are loaded via include_dir or include_if_exists
include_if_exists = '/etc/postgresql/conf.d/00-autotune.conf'
