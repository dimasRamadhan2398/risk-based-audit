# ============================================================================
# AuditSphere Data Hub — Nginx Reverse Proxy
# Routes: / → JupyterLab (with Basic Auth)
# AI Engine & Data Hub API accessed directly via ports (VPN only)
# ============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Upstream: JupyterLab
    upstream jupyter {
        server caatt-engine:8888;
    }

    server {
        listen 80;
        server_name _;

        # ── Health check (no auth) ───────────────────────────────────────
        location = /health {
            return 200 '{"status":"ok","service":"auditsphere-data-hub-nginx"}';
            add_header Content-Type application/json;
        }

        # ── JupyterLab (Basic Auth) ─────────────────────────────────────
        location / {
            auth_basic "AuditSphere Data Hub — Login Required";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://jupyter;

            # WebSocket support (required for JupyterLab kernels)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-running notebook cells
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;

            # Buffering off for real-time output
            proxy_buffering off;
        }

        # ── Block access to sensitive paths ──────────────────────────────
        location ~ /\. {
            deny all;
        }
    }
}
