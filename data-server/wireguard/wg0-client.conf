# ============================================================================
# WireGuard VPN — Audit Server (Client) Configuration
# File: /etc/wireguard/wg0.conf (on Audit Server 202.10.34.166)
#
# Replace placeholders:
#   CLIENT_PRIVATE_KEY  → wg genkey on audit server
#   SERVER_PUBLIC_KEY   → from data hub server's server_public.key
# ============================================================================

[Interface]
Address = 10.0.0.2/24
PrivateKey = CLIENT_PRIVATE_KEY

# ─── Peer: Data Hub Server (187.127.122.82) ──────────────────────────────────
[Peer]
PublicKey = SERVER_PUBLIC_KEY
Endpoint = 187.127.122.82:51820
AllowedIPs = 10.0.0.1/32
PersistentKeepalive = 25
