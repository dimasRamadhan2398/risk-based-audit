# ============================================================================
# WireGuard VPN — Data Hub Server Configuration
# File: /etc/wireguard/wg0.conf (on Data Hub server 187.127.122.82)
#
# Replace placeholders:
#   SERVER_PRIVATE_KEY  → from /opt/auditsphere-data/wireguard/server_private.key
#   CLIENT_PUBLIC_KEY   → from audit server's wg pubkey
# ============================================================================

[Interface]
Address = 10.0.0.1/24
ListenPort = 51820
PrivateKey = SERVER_PRIVATE_KEY

# Optional: enable IP forwarding for the VPN interface
PostUp   = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

# ─── Peer: Audit Server (202.10.34.166) ──────────────────────────────────────
[Peer]
PublicKey = CLIENT_PUBLIC_KEY
AllowedIPs = 10.0.0.2/32
# PersistentKeepalive is useful if the audit server is behind NAT
PersistentKeepalive = 25
